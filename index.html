<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FOURCARD - 캐릭터 선택 프로토타입</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-dark: #0B241E;
      --gold: #B8964E;
      --gold-btn: #C9A86C;
      --bg: #F4F4F4;
      --card-bg: #FFFFFF;
      --text: #1A1A1A;
      --text-sub: #888888;
      --border: #E8E8E8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #222; color: var(--text);
      min-height: 100vh; display: flex; justify-content: center;
      align-items: flex-start; padding: 16px 0 32px;
    }

    .phone {
      width: 390px; min-height: 844px; background: var(--bg);
      border-radius: 32px; overflow: hidden; position: relative;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 2px #ccc;
    }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 52px 20px 12px; background: var(--bg);
    }

    .logo { display: flex; align-items: center; gap: 6px; }
    .logo-text { font-size: 15px; font-weight: 800; color: var(--green-dark); }
    .welcome { font-size: 15px; font-weight: 600; flex: 1; text-align: center; }
    .header-icons { display: flex; gap: 14px; align-items: center; }

    .header-icon-btn {
      background: none; border: none; cursor: pointer;
      position: relative; padding: 2px; color: var(--text);
    }

    .profile-badge {
      position: absolute; bottom: -2px; right: -4px;
      width: 14px; height: 14px; background: var(--green-dark);
      border-radius: 50%; border: 1.5px solid var(--bg);
      display: flex; align-items: center; justify-content: center;
    }

    .members-banner {
      margin: 8px 16px 16px; background: var(--green-dark);
      border-radius: 20px; padding: 24px 20px; overflow: hidden;
    }

    .banner-label { font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: 1.5px; margin-bottom: 8px; }
    .banner-title { font-size: 18px; font-weight: 700; color: #fff; line-height: 1.4; margin-bottom: 16px; }

    .login-btn {
      background: var(--gold-btn); color: var(--green-dark);
      border: none; border-radius: 24px; padding: 10px 20px;
      font-size: 13px; font-weight: 700; cursor: pointer;
    }

    .ticket-row { display: flex; gap: 10px; padding: 0 16px; margin-bottom: 16px; }

    .ticket-card {
      flex: 1; background: var(--card-bg); border-radius: 16px;
      padding: 16px; border: 1px solid var(--border);
    }

    .ticket-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .ticket-count { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .ticket-count span { font-size: 14px; font-weight: 600; }
    .ticket-sub { font-size: 11px; color: var(--text-sub); }

    .menu-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 10px; padding: 0 16px; margin-bottom: 20px;
    }

    .menu-item {
      background: var(--card-bg); border-radius: 16px; padding: 16px 8px;
      border: 1px solid var(--border); text-align: center;
    }

    .menu-item span { font-size: 11px; font-weight: 600; }

    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--card-bg); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 10px 0 28px;
    }

    .nav-item {
      background: none; border: none; color: var(--text-sub);
      font-size: 10px; cursor: pointer;
    }

    .nav-item.active { color: var(--green-dark); font-weight: 600; }
    .screen-body { padding-bottom: 80px; }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 100;
      flex-direction: column; justify-content: flex-end;
    }

    .modal-overlay.active { display: flex; }

    .bottom-sheet {
      background: var(--card-bg); border-radius: 24px 24px 0 0;
      max-height: 92%; display: flex; flex-direction: column;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @keyframes idle-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes idle-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes shadow-pulse {
      0%, 100% { opacity: 0.35; transform: translateX(-50%) scaleX(1); }
      50% { opacity: 0.22; transform: translateX(-50%) scaleX(0.88); }
    }

    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px 0;
    }

    .sheet-header h2 { font-size: 17px; font-weight: 700; }

    .sheet-close-x {
      background: none; border: none; font-size: 20px;
      color: var(--text-sub); cursor: pointer;
    }

    .sheet-tabs {
      display: flex; margin: 14px 20px 0;
      background: #F0F0F0; border-radius: 12px; padding: 3px;
    }

    .sheet-tab {
      flex: 1; padding: 10px; border: none; border-radius: 10px;
      background: transparent; font-size: 13px; font-weight: 600;
      color: var(--text-sub); cursor: pointer;
    }

    .sheet-tab.active {
      background: var(--card-bg); color: var(--green-dark);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .sheet-body { flex: 1; overflow-y: auto; padding: 14px 20px 8px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .char-stage-wrap {
      background: linear-gradient(180deg, #1a2e28 0%, #0B241E 60%, #061510 100%);
      border-radius: 20px; position: relative; overflow: hidden; margin-bottom: 12px;
    }

    .char-stage-wrap::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(184,150,78,0.18), transparent),
        radial-gradient(ellipse 50% 40% at 50% 20%, rgba(255,255,255,0.06), transparent);
      pointer-events: none;
    }

    .char-stage {
      height: 280px; display: flex; align-items: flex-end; justify-content: center;
      position: relative; padding-bottom: 4px;
    }

    .stage-char {
      position: absolute; bottom: 8px;
      transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
      cursor: pointer; display: flex; flex-direction: column; align-items: center;
    }

    .stage-char.dim { opacity: 0.6; filter: brightness(0.5) saturate(0.55); }

    .avatar-portrait {
      position: relative; display: flex; flex-direction: column; align-items: center;
    }

    .avatar-portrait.idle-active .portrait-inner {
      animation: idle-float 3s ease-in-out infinite, idle-breathe 3s ease-in-out infinite;
    }

    .portrait-shadow {
      position: absolute; bottom: -6px; left: 50%;
      width: 70%; height: 10px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.45), transparent);
      transform: translateX(-50%);
      pointer-events: none; z-index: 0;
    }

    .avatar-portrait.idle-active .portrait-shadow {
      animation: shadow-pulse 3s ease-in-out infinite;
    }

    .portrait-inner {
      position: relative; z-index: 1; border-radius: 16px; overflow: hidden;
      transform-origin: center bottom;
      background: #0a0a0a;
    }

    .portrait-inner img {
      display: block; width: 100%; height: 100%;
      object-fit: cover; object-position: center bottom;
    }

    .frame-deco {
      position: absolute; inset: -8px; pointer-events: none; z-index: 2;
    }

    .stage-char.center .portrait-inner {
      box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 24px rgba(184,150,78,0.15);
    }

    .stage-name-row {
      display: flex; align-items: center; justify-content: center;
      gap: 20px; padding: 6px 0 14px; position: relative; z-index: 1;
    }

    .stage-name { font-size: 18px; font-weight: 800; color: #fff; min-width: 70px; text-align: center; }

    .arrow-btn {
      width: 32px; height: 32px; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%; background: rgba(255,255,255,0.1);
      color: var(--gold-btn); font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .char-desc-box {
      background: #F8FAF9; border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 14px;
      font-size: 12px; line-height: 1.65; color: var(--text-sub);
    }

    .section-label { font-size: 13px; font-weight: 700; margin-bottom: 10px; }

    .section-hint {
      font-size: 11px; color: var(--text-sub); margin: -6px 0 10px; line-height: 1.4;
    }

    .char-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 8px;
    }

    .char-card {
      border: 2px solid var(--border); border-radius: 14px;
      overflow: hidden; cursor: pointer; background: #fff;
      transition: border-color 0.2s, transform 0.15s;
    }

    .char-card.selected { border-color: var(--green-dark); transform: scale(1.02); }

    .char-card-img {
      aspect-ratio: 3/4; overflow: hidden;
      background: #0a0a0a;
    }

    .char-card-img img {
      width: 100%; height: 100%; object-fit: cover; object-position: center bottom;
    }

    .char-card-info { padding: 8px 6px; text-align: center; }
    .char-card-name { font-size: 12px; font-weight: 700; padding: 2px 0; }

    .customize-stage {
      display: flex; justify-content: center; padding: 12px 0 4px;
      min-height: 270px; align-items: center;
    }

    .customize-stage .avatar-portrait { transform: scale(1.05); }

    .option-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }

    .outfit-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 8px; border-radius: 12px; border: 2px solid var(--border);
      background: var(--card-bg); cursor: pointer; min-width: 72px;
      transition: border-color 0.2s, transform 0.15s;
    }

    .outfit-btn.selected { border-color: var(--green-dark); background: #F0F7F4; transform: scale(1.04); }

    .outfit-thumb {
      width: 48px; height: 48px; border-radius: 10px;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.15);
    }

    .outfit-label { font-size: 10px; font-weight: 600; color: var(--text-sub); }

    .accessory-btn, .frame-btn {
      padding: 10px 8px; border-radius: 12px;
      border: 2px solid var(--border); background: var(--card-bg);
      cursor: pointer; text-align: center; min-width: 72px;
      transition: border-color 0.2s, opacity 0.2s;
    }

    .accessory-btn.selected, .frame-btn.selected {
      border-color: var(--green-dark); background: #F0F7F4;
    }

    .accessory-btn.disabled {
      opacity: 0.45; pointer-events: none; cursor: not-allowed;
      filter: grayscale(0.6);
    }

    .acc-icon { font-size: 22px; margin-bottom: 4px; line-height: 1; }

    .acc-soon {
      font-size: 8px; color: var(--text-sub); margin-top: 3px;
      font-weight: 600;
    }

    .acc-label, .frame-label { font-size: 10px; font-weight: 600; color: var(--text-sub); }

    .frame-btn { min-width: 68px; padding: 8px 6px; }

    .frame-preview-box {
      width: 44px; height: 44px; margin: 0 auto 6px;
      position: relative; border-radius: 8px; overflow: visible;
    }

    .frame-preview-box .mini-inner {
      position: absolute; inset: 6px; border-radius: 4px;
      background: #0a0a0a;
    }

    .frame-preview-box svg { position: absolute; inset: 0; }

    .sheet-footer {
      padding: 10px 20px 28px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }

    .confirm-btn {
      width: 100%; padding: 14px; border-radius: 14px; border: none;
      background: var(--green-dark); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }

    .close-btn {
      width: 100%; padding: 14px; border-radius: 14px;
      border: 1px solid var(--border); background: var(--card-bg);
      color: var(--text-sub); font-size: 15px; font-weight: 600; cursor: pointer;
    }

    .header-profile-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      overflow: hidden; border: 1.5px solid var(--green-dark);
    }

    .header-profile-avatar img {
      width: 100%; height: 100%; object-fit: cover; object-position: center 90%;
    }

    .proto-badge {
      position: fixed; top: 8px; right: 8px;
      background: var(--gold); color: var(--green-dark);
      font-size: 11px; font-weight: 700; padding: 4px 10px;
      border-radius: 20px; z-index: 999;
    }

    .ai-note {
      font-size: 10px; color: var(--text-sub); text-align: center;
      padding: 0 20px 6px; line-height: 1.4;
    }

    .toast {
      position: absolute; bottom: 100px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--green-dark); color: #fff;
      padding: 12px 24px; border-radius: 24px; font-size: 13px;
      opacity: 0; transition: all 0.3s; z-index: 200;
      pointer-events: none; white-space: nowrap;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="proto-badge">UI 프로토타입</div>

  <div class="phone">
    <div class="screen-body">
      <div class="header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28"><rect width="28" height="28" rx="6" fill="#0B241E"/><text x="14" y="19" text-anchor="middle" fill="#B8964E" font-size="11" font-weight="800" font-family="sans-serif">4C</text></svg>
          <span class="logo-text">FOURCARD</span>
        </div>
        <span class="welcome">어서 오세요</span>
        <div class="header-icons">
          <button class="header-icon-btn" onclick="openCharSelect()">
            <div id="header-avatar" class="header-profile-avatar"></div>
            <div class="profile-badge"><svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 4h6M4 1v6" stroke="white" stroke-width="1.2"/></svg></div>
          </button>
          <button class="header-icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg></button>
          <button class="header-icon-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>
        </div>
      </div>

      <div class="members-banner">
        <div class="banner-label">FOURCARD MEMBERS</div>
        <div class="banner-title">로그인하고<br>포카드 시작하기</div>
        <button class="login-btn">로그인 / 회원가입 →</button>
      </div>

      <div class="ticket-row">
        <div class="ticket-card"><h3>매장이용권</h3><div class="ticket-count">0<span>장</span></div><div class="ticket-sub">현재 매장 사용 가능</div></div>
        <div class="ticket-card"><h3>대회참여권</h3><div class="ticket-count">0<span>장</span></div><div class="ticket-sub">매장 전용 · 유효기간 없음</div></div>
      </div>

      <div class="menu-grid">
        <div class="menu-item"><span>테이블<br>예약</span></div>
        <div class="menu-item"><span>QR<br>체크인</span></div>
        <div class="menu-item"><span>대회<br>일정</span></div>
        <div class="menu-item"><span>이용<br>내역</span></div>
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item active">홈</button>
      <button class="nav-item">매장</button>
      <button class="nav-item">대회</button>
      <button class="nav-item">MY</button>
    </nav>

    <div id="char-modal" class="modal-overlay active">
      <div class="bottom-sheet">
        <div class="sheet-header">
          <h2>캐릭터 선택</h2>
          <button class="sheet-close-x" onclick="closeCharSelect()">✕</button>
        </div>

        <div class="sheet-tabs">
          <button class="sheet-tab active" data-tab="select" onclick="switchTab('select')">캐릭터</button>
          <button class="sheet-tab" data-tab="customize" onclick="switchTab('customize')">꾸미기</button>
        </div>

        <div class="sheet-body">
          <div id="tab-select" class="tab-panel active">
            <div class="char-stage-wrap">
              <div id="char-stage" class="char-stage"></div>
              <div class="stage-name-row">
                <button class="arrow-btn" onclick="prevChar()">◀</button>
                <div id="stage-name" class="stage-name">에이스</div>
                <button class="arrow-btn" onclick="nextChar()">▶</button>
              </div>
            </div>
            <div id="char-desc" class="char-desc-box"></div>
            <div class="section-label">캐릭터 목록</div>
            <div id="char-grid" class="char-grid"></div>
          </div>

          <div id="tab-customize" class="tab-panel">
            <div class="char-stage-wrap">
              <div id="customize-stage" class="customize-stage"></div>
            </div>
            <div class="section-label">의상 색상</div>
            <p class="section-hint">손님 등급에 따라 의상 색상이 적용됩니다 (추후 연동 · 현재는 UI만 표시)</p>
            <div class="option-row" id="outfit-options"></div>
            <div class="section-label">액세서리</div>
            <p class="section-hint">추후 업데이트 예정 (현재 선택 불가)</p>
            <div class="option-row" id="accessory-options"></div>
            <div class="section-label">프레임</div>
            <div class="option-row" id="frame-options"></div>
          </div>
        </div>

        <p class="ai-note">캐릭터 일러스트 AI 생성 · Dark &amp; Chic 2등신 마스코트 (프로토타입용)</p>

        <div class="sheet-footer">
          <button class="confirm-btn" onclick="confirmChar()">선택 완료</button>
          <button class="close-btn" onclick="closeCharSelect()">✕ 닫기</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    const CHARACTERS = [
      {
        id: 'wolf',
        name: '킹스',
        desc: '은빛 털의 늑대. 검은 가죽 재킷과 블랙 데님을 입고 한 손은 주머니에 — 입꼬리를 살짝 올린 비웃음 뒤, 테이블의 기세를 압도하는 과감하고 공격적인 플레이어의 상징입니다.'
      },
      {
        id: 'chase',
        name: '하트',
        desc: '단발 머리에 하트 핀과 플리츠 치마, 카드를 들고 발랄하게 포즈를 취하는 어린 그라인더. 날씬한 2등신 체형에 귀여운 블라우스와 치마 차림으로 테이블에 앉아, 밝고 산뜻한 에너지로 한 판 한 판 칩을 모아가는 하트 수트의 귀여운 도전자입니다.'
      },
      {
        id: 'river',
        name: '클로버',
        desc: '정장 베스트와 멜빵, 헌팅캡을 쓴 거북 신사. 두꺼운 안경 너머의 상냥한 미소 뒤, 마지막 리버 카드까지 인내하며 호락호락하게 칩을 내주지 않는 타이트한 플레이어입니다.'
      },
      {
        id: 'fox',
        name: '퀸스',
        desc: '갈색 털의 여우. 킹스와 짝을 이루는 블랙 레더 재킷 차림으로 한 손은 허리에 — 살짝 올린 입꼬리 뒤, 상대의 심리를 꿰뚫어보는 날카로운 관찰력과 계산적인 플레이로 테이블을 읽어내는 냉철한 플레이어입니다.'
      },
      {
        id: 'metis',
        name: '스페이드',
        desc: '매트한 블랙 스크린 얼굴의 딜러 안드로이드. 테크웨어 자켓 테두리와 눈에서 형광 초록 LED가 빛나며, 룰과 시간을 한 치의 오차도 없이 관리하는 완벽주의자입니다.'
      },
      {
        id: 'bluff',
        name: '블러프',
        desc: '반투명한 몸에 오버핏 코트와 페도라를 눌러쓴 유령. 코트 깃으로 표정을 가리고 소매에서 카드를 꺼내듯 — 속내를 알 수 없는 심리전의 달인입니다.'
      },
      {
        id: 'maestro',
        name: '다이아',
        desc: '터시도 연미복과 스페이드 하프 마스크를 쓴 쇼 호스트. 홀덤펍의 분위기를 띄우고 토너먼트의 시작을 알리며, 우아한 손짓으로 카드를 셔플하는 신비주의자입니다.'
      }
    ];

    /* 손님 등급별 의상 색상 — 추후 등급 API 연동 시 outfit id로 매핑 */
    const OUTFITS = [
      { id: 'bronze', label: '브론즈', color: 'linear-gradient(145deg, #C07B4E, #5C3A24)' },
      { id: 'silver', label: '실버', color: 'linear-gradient(145deg, #C0C5CE, #6B7280)' },
      { id: 'gold', label: '골드', color: 'linear-gradient(145deg, #B8964E, #4A3820)' },
      { id: 'emerald', label: '에메랄드', color: 'linear-gradient(145deg, #1E4D3A, #0B241E)' },
      { id: 'diamond', label: '다이아', color: 'linear-gradient(145deg, #B8E0F0, #4A7A9B)' },
      { id: 'black', label: '블랙', color: 'linear-gradient(145deg, #2A2A2E, #0A0A0C)' }
    ];

    const ACCESSORIES = [
      { id: 'crown', label: '왕관', icon: '👑' },
      { id: 'sunglasses', label: '선글라스', icon: '🕶️' },
      { id: 'cardpin', label: '카드핀', icon: '🃏' },
      { id: 'earring', label: '이어링', icon: '💎' },
      { id: 'scarf', label: '스카프', icon: '🧣' },
      { id: 'watch', label: '시계', icon: '⌚' }
    ];

    const FRAMES = [
      { id: 'basic', label: '기본' },
      { id: 'gold', label: '골드' },
      { id: 'neon', label: '네온' },
      { id: 'classic', label: '클래식' },
      { id: 'spade', label: '스페이드' },
      { id: 'diamond', label: '다이아' },
      { id: 'royal', label: '로얄' },
      { id: 'chip', label: '칩' }
    ];

    let currentIndex = Math.min(
      parseInt(localStorage.getItem('fourcardChar') || '0', 10),
      CHARACTERS.length - 1
    );
    let selectedIndex = currentIndex;
    let custom = JSON.parse(localStorage.getItem('fourcardCustom') || '{"outfit":"bronze","frame":"basic"}');

    function getCharImage(charId, outfit) {
      /* 등급별 의상 에셋: assets/char-{id}-{outfit}.png — 없으면 기본 */
      if (outfit && outfit !== 'bronze') {
        return `assets/char-${charId}-${outfit}.png`;
      }
      return `assets/char-${charId}.png`;
    }

    function imgWithFallback(charId, outfit) {
      const primary = getCharImage(charId, outfit);
      const fallback = `assets/char-${charId}.png`;
      return `<img src="${primary}" alt="" draggable="false" onerror="this.onerror=null;this.src='${fallback}'">`;
    }

    function getFrameSvg(frameId) {
      const gold = '#B8964E';
      const green = '#0B241E';
      const svgs = {
        basic: `<rect x="2" y="2" width="96" height="96" rx="14" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>`,
        gold: `<rect x="2" y="2" width="96" height="96" rx="12" fill="none" stroke="${gold}" stroke-width="3"/>
          <path d="M2 14 L14 2 M86 2 L98 14 M98 86 L86 98 M14 98 L2 86" stroke="${gold}" stroke-width="2" fill="none"/>
          <circle cx="50" cy="4" r="3" fill="${gold}"/>`,
        neon: `<rect x="4" y="4" width="92" height="92" rx="14" fill="none" stroke="#39FF14" stroke-width="2"/>
          <rect x="1" y="1" width="98" height="98" rx="16" fill="none" stroke="${gold}" stroke-width="1.5" opacity="0.7"/>`,
        classic: `<rect x="2" y="2" width="96" height="96" rx="6" fill="none" stroke="${green}" stroke-width="3"/>
          <text x="10" y="18" fill="${gold}" font-size="12" font-weight="800">A</text>
          <text x="82" y="92" fill="${gold}" font-size="12" font-weight="800" transform="rotate(180 88 88)">A</text>`,
        spade: `<rect x="3" y="3" width="94" height="94" rx="12" fill="none" stroke="${green}" stroke-width="2"/>
          <text x="50" y="16" text-anchor="middle" fill="${green}" font-size="14">♠</text>
          <text x="50" y="94" text-anchor="middle" fill="${green}" font-size="14">♠</text>`,
        diamond: `<rect x="3" y="3" width="94" height="94" rx="12" fill="none" stroke="${gold}" stroke-width="2"/>
          <path d="M50 6 L56 16 L50 26 L44 16Z" fill="${gold}"/>
          <path d="M50 74 L56 84 L50 94 L44 84Z" fill="${gold}"/>`,
        royal: `<rect x="2" y="2" width="96" height="96" rx="14" fill="none" stroke="${gold}" stroke-width="2.5"/>
          <path d="M34 8 L38 2 L42 8 L50 0 L58 8 L62 2 L66 8 L62 14 L38 14Z" fill="${gold}"/>`,
        chip: `<circle cx="50" cy="50" r="46" fill="none" stroke="${green}" stroke-width="3"/>
          <circle cx="50" cy="50" r="40" fill="none" stroke="${gold}" stroke-width="1.5" stroke-dasharray="6 4"/>`
      };
      return `<svg class="frame-deco" viewBox="0 0 100 143" preserveAspectRatio="none">${svgs[frameId] || svgs.basic}</svg>`;
    }

    function getMiniFrameSvg(frameId) {
      return getFrameSvg(frameId).replace('class="frame-deco"', 'width="44" height="44"');
    }

    function buildPortrait(char, w, h, frameId, idle) {
      const idleCls = idle ? ' idle-active' : '';
      const img = imgWithFallback(char.id, custom.outfit).replace('alt=""', `alt="${char.name}"`);
      return `
        <div class="avatar-portrait${idleCls}" style="width:${w}px">
          <div class="portrait-shadow"></div>
          <div class="portrait-inner" style="width:${w}px;height:${h}px">
            ${img}
            ${frameId ? getFrameSvg(frameId) : ''}
          </div>
        </div>`;
    }

    function renderStage() {
      const stage = document.getElementById('char-stage');
      stage.innerHTML = '';
      CHARACTERS.forEach((ch, i) => {
        const offset = i - selectedIndex;
        if (Math.abs(offset) > 2) return;
        const item = document.createElement('div');
        item.className = 'stage-char' + (offset === 0 ? ' center' : ' dim');
        const w = offset === 0 ? 140 : Math.max(80, 110 - Math.abs(offset) * 18);
        const h = offset === 0 ? 210 : Math.max(130, 175 - Math.abs(offset) * 28);
        const x = offset * (offset === 0 ? 0 : 62 + Math.abs(offset) * 5);
        item.style.transform = `translateX(${x}px)`;
        item.style.zIndex = 10 - Math.abs(offset);
        item.innerHTML = buildPortrait(ch, w, h, null, offset === 0);
        item.onclick = () => { selectedIndex = i; renderAll(); };
        stage.appendChild(item);
      });
      const ch = CHARACTERS[selectedIndex];
      document.getElementById('stage-name').textContent = ch.name;
      document.getElementById('char-desc').textContent = ch.desc;
    }

    function renderGrid() {
      const grid = document.getElementById('char-grid');
      grid.innerHTML = '';
      CHARACTERS.forEach((c, i) => {
        const card = document.createElement('div');
        card.className = 'char-card' + (i === selectedIndex ? ' selected' : '');
        const img = imgWithFallback(c.id, i === selectedIndex ? custom.outfit : 'bronze').replace(`alt=""`, `alt="${c.name}"`);
        card.innerHTML = `
          <div class="char-card-img">${img}</div>
          <div class="char-card-info">
            <div class="char-card-name">${c.name}</div>
          </div>`;
        card.onclick = () => { selectedIndex = i; renderAll(); };
        grid.appendChild(card);
      });
    }

    function renderCustomize() {
      const ch = CHARACTERS[selectedIndex];
      document.getElementById('customize-stage').innerHTML =
        buildPortrait(ch, 160, 220, custom.frame, true);

      document.getElementById('outfit-options').innerHTML = OUTFITS.map(o =>
        `<div class="outfit-btn${custom.outfit === o.id ? ' selected' : ''}" onclick="setOutfit('${o.id}')">
          <div class="outfit-thumb" style="background:${o.color}"></div>
          <div class="outfit-label">${o.label}</div>
        </div>`
      ).join('');

      document.getElementById('accessory-options').innerHTML = ACCESSORIES.map(a =>
        `<div class="accessory-btn disabled" title="준비 중">
          <div class="acc-icon">${a.icon}</div>
          <div class="acc-label">${a.label}</div>
          <div class="acc-soon">준비 중</div>
        </div>`
      ).join('');

      document.getElementById('frame-options').innerHTML = FRAMES.map(f =>
        `<div class="frame-btn${custom.frame === f.id ? ' selected' : ''}" onclick="setFrame('${f.id}')">
          <div class="frame-preview-box">
            <div class="mini-inner"></div>
            ${getMiniFrameSvg(f.id)}
          </div>
          <div class="frame-label">${f.label}</div>
        </div>`
      ).join('');
    }

    function setOutfit(id) { custom.outfit = id; renderAll(); }
    function setFrame(id) { custom.frame = id; renderAll(); }
    function renderAll() { renderStage(); renderGrid(); renderCustomize(); }

    function switchTab(tab) {
      document.querySelectorAll('.sheet-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
    }

    function prevChar() { selectedIndex = (selectedIndex - 1 + CHARACTERS.length) % CHARACTERS.length; renderAll(); }
    function nextChar() { selectedIndex = (selectedIndex + 1) % CHARACTERS.length; renderAll(); }

    function updateHeaderAvatar() {
      const ch = CHARACTERS[currentIndex];
      document.getElementById('header-avatar').innerHTML =
        imgWithFallback(ch.id, custom.outfit).replace(`alt=""`, `alt="${ch.name}"`);
    }

    function openCharSelect() {
      selectedIndex = currentIndex;
      custom = JSON.parse(localStorage.getItem('fourcardCustom') || '{"outfit":"bronze","frame":"basic"}');
      renderAll();
      document.getElementById('char-modal').classList.add('active');
    }

    function closeCharSelect() { document.getElementById('char-modal').classList.remove('active'); }

    function confirmChar() {
      currentIndex = selectedIndex;
      localStorage.setItem('fourcardChar', currentIndex);
      localStorage.setItem('fourcardCustom', JSON.stringify(custom));
      updateHeaderAvatar();
      closeCharSelect();
      showToast(CHARACTERS[currentIndex].name + ' 캐릭터가 저장되었습니다!');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    let touchStartX = 0;
    document.getElementById('char-stage').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    document.getElementById('char-stage').addEventListener('touchend', e => {
      const diff = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(diff) > 40) diff < 0 ? nextChar() : prevChar();
    }, { passive: true });

    renderAll();
    updateHeaderAvatar();
  </script>
</body>
</html>
